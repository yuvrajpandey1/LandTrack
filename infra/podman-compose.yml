name: landtrack-podman

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: landtrack
      POSTGRES_PASSWORD: landtrack
      POSTGRES_DB: landtrack
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U landtrack -d landtrack']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/rustfs/rustfs:latest
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: landtracklocal
      RUSTFS_SECRET_KEY: landtrack-local-only-secret
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  mailhog:
    image: docker.io/mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  clamav:
    image: docker.io/clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - '3310:3310'

  api:
    image: localhost/landtrack-api:podman
    build:
      context: ..
      dockerfile: apps/api/Containerfile
    restart: unless-stopped
    env_file:
      - ./podman.env
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:3001
      API_URL: http://localhost:4001
      DATABASE_URL: postgresql://landtrack:landtrack@postgres:5432/landtrack
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-south-1
      S3_BUCKET: landtrack
      S3_ACCESS_KEY: landtracklocal
      S3_SECRET_KEY: landtrack-local-only-secret
      SMTP_URL: smtp://mailhog:1025
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailhog:
        condition: service_started
      clamav:
        condition: service_started
    ports:
      - '4001:4000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 20

  seed:
    image: localhost/landtrack-api:podman
    profiles:
      - setup
    env_file:
      - ./podman.env
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:3001
      API_URL: http://localhost:4001
      DATABASE_URL: postgresql://landtrack:landtrack@postgres:5432/landtrack
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-south-1
      S3_BUCKET: landtrack
      S3_ACCESS_KEY: landtracklocal
      S3_SECRET_KEY: landtrack-local-only-secret
      SMTP_URL: smtp://mailhog:1025
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailhog:
        condition: service_started
      clamav:
        condition: service_started
    command: ['sh', '-c', 'pnpm --dir apps/api exec prisma migrate deploy && pnpm --dir apps/api db:seed']

  web:
    image: localhost/landtrack-web:podman
    build:
      context: ..
      dockerfile: apps/web/Containerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3001:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  pgdata:
  minio_data:
